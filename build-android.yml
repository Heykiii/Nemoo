name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unpack project from noomi.zip
        run: |
          ls -la
          unzip -q noomi.zip -d work
          ls -la work/noomi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Godot for Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          S=~/.config/godot/editor_settings-4.3.tres
          echo '[gd_resource type="EditorSettings" format=3]' > $S
          echo '' >> $S
          echo '[resource]' >> $S
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> $S
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> $S
          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> $S
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
          echo 'export/android/debug_keystore_pass = "android"' >> $S
          cat $S

      - name: Import project
        working-directory: work/noomi
        run: godot --headless --path . --import || true

      - name: Export debug APK
        working-directory: work/noomi
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/noomi-debug.apk
          ls -l build

      - uses: actions/upload-artifact@v5
        with:
          name: noomi-debug-apk
          path: work/noomi/build/noomi-debug.apk

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build work/noomi/build/noomi-debug.apk --title "Noomi debug build" --notes "Debug APK built from ${{ github.sha }}" --prerelease
